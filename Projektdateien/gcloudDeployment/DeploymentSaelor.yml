apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-api
  template:
    metadata:
      labels:
        app: saleor-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - pl-worker
      containers:
      - name: api
        image: ghcr.io/saleor/saleor:3.23
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: saleor-config
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: saleor-media-pvc-2
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: saleor-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-worker
  template:
    metadata:
      labels:
        app: saleor-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/saleor/saleor:3.23
        command: ["celery", "-A", "saleor", "--app=saleor.celeryconf:app", "worker", "--loglevel=info", "-B"]
        envFrom:
        - configMapRef:
            name: saleor-config
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: saleor-media-pvc
