apiVersion: v1
kind: Secret
metadata:
  name: mongodb-keyfile
  namespace: rocketchat
type: Opaque
stringData:
  keyfile: |
    HierStehtEinSehrLangerZufallstextMitMindestens64ZeichenDerAlsSharedSecretDientUndSicherSeinMuss
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: rocketchat
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: rocketchat
spec:
  serviceName: "mongodb-service"
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 1001
      
      # --- AUTOMATISIERUNG VIA INIT-CONTAINER ---
      initContainers:
      - name: bootstrap-cluster
        image: quay.io/mongodb/mongodb-community-server:8.0.0-ubi8
        env:
        # Hier werden deine existierenden Secrets als Umgebungsvariablen geladen
        - name: MONGO_ADMIN_PWD
          valueFrom:
            secretKeyRef:
              name: mongodb-admin-password
              key: password
        - name: MONGO_ROCKETCHAT_PWD
          valueFrom:
            secretKeyRef:
              name: mongodb-rocketchat-password
              key: password
        command:
        - "sh"
        - "-c"
        - |
          # Wir führen das Setup nur auf der ersten Node aus
          if [ "$(hostname)" = "mongodb-0" ]; then
            echo "Warte, bis MongoDB lokal startet..."
            until mongosh --eval "print('ready')" >/dev/null 2>&1; do sleep 2; done

            echo "Initialisiere Replica Set..."
            mongosh --eval '
              try {
                rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongodb-0.mongodb-service.rocketchat.svc.cluster.local:27017" },
                    { _id: 1, host: "mongodb-1.mongodb-service.rocketchat.svc.cluster.local:27017" },
                    { _id: 2, host: "mongodb-2.mongodb-service.rocketchat.svc.cluster.local:27017" }
                  ]
                });
              } catch(e) { print("Replica Set bereits initialisiert oder Fehler: " + e); }
            '
            
            # Kurze Pause, damit das Replica-Set sich wählen kann (Primary-Erkennung)
            sleep 5

            echo "Erstelle User..."
            mongosh --eval "
              try {
                db.getSiblingDB('admin').createUser({
                  user: 'admin',
                  pwd: '$MONGO_ADMIN_PWD',
                  roles: [{ role: 'root', db: 'admin' }]
                });
                print('Admin User erfolgreich erstellt.');
              } catch(e) { print('Admin existiert vermutlich schon.'); }

              try {
                db.getSiblingDB('rocketchat').createUser({
                  user: 'rocketchat',
                  pwd: '$MONGO_ROCKETCHAT_PWD',
                  roles: [{ role: 'readWrite', db: 'rocketchat' }]
                });
                print('Rocketchat User erfolgreich erstellt.');
              } catch(e) { print('Rocketchat User existiert vermutlich schon.'); }
            "
          fi
      # ------------------------------------------

      containers:
      - name: mongodb
        image: quay.io/mongodb/mongodb-community-server:8.0.0-ubi8
        command:
        - "mongod"
        - "--bind_ip_all"
        - "--replSet"
        - "rs0"
        - "--auth"
        - "--keyFile"
        - "/etc/mongodb/keyfile"
        ports:
        - containerPort: 27017
          name: mongodb
        resources:
          limits:
            cpu: "1500m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "300Mi"
        volumeMounts:
        - name: data-volume
          mountPath: /data/db
        - name: keyfile-volume
          mountPath: /etc/mongodb
          readOnly: true
      volumes:
      - name: keyfile-volume
        secret:
          secretName: mongodb-keyfile
          defaultMode: 0400
  volumeClaimTemplates:
  - metadata:
      name: data-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 50Gi
